<!DOCTYPE html>
<html>
  <head>
    <title>AR Educativa - Escáner de Fósiles</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        .ar-ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0,0,0,0.7); color: white;
            padding: 15px; border-radius: 15px; text-align: center; width: 80%;
            font-family: sans-serif;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    

    <div class="ar-ui">
        <strong>Modo Escáner Activo</strong><br>
        Apunta al marcador HIRO para ver el dinosaurio.
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker preset="hiro">
            
            <a-entity 
                id="dino"
                position="0 0 0" 
                scale="0.05 0.05 0.05"
                gltf-model="url(https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf)"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-entity>

            <a-entity position="0 1.5 0" rotation="-90 0 0">
                <a-plane width="2" height="0.6" color="#333" opacity="0.8"></a-plane>
                <a-text value="TYRANNOSAURUS REX\nPeriodo Cretacico" align="center" color="#FFD700" width="4"></a-text>
            </a-entity>

        </a-marker>

        <a-entity camera="fov: 100" position="0 1.6 0"></a-entity>
        
    </a-scene>
</body>
</html>
