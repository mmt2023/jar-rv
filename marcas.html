<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detector de Marcas IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a00; color: white; text-align: center;}
        #video-container { position: relative; display: inline-block; margin-top: 20px; border-radius: 15px; overflow: hidden; border: 4px solid #00000000; }
        #label-container { margin-top: 20px; font-size: 24px; font-weight: bold; }
        
        /* Ventanita de informacion */
        #brand-card {
            display: none; position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); width: 80%; background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px); border: 1px solid #00d4ff;
            padding: 15px; border-radius: 12px; animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { bottom: -100px; } to { bottom: 20px; } }
        .highlight { color: #00d4ff; }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="webcam-container"></div>
        <div id="brand-card">
            <h2 id="brand-title">Marca</h2>
            <p id="brand-desc">Descripción técnica...</p>
        </div>
    </div>
    <div id="label-container">
        <img src="img/nocamera.png" alt="Camara no disponible" width="800px" height="600px"> 
    </div>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/kcJM8uiBS/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Cargar el modelo
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Configurar webcam
            const flip = true; 
            webcam = new tmImage.Webcam(800, 600); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            labelContainer.innerText = "Sistema Activo | Enfoca un dispositivo movil...";
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // Buscamos la predicción con mayor probabilidad
            let bestPrediction = { className: "", probability: 0 };
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > bestPrediction.probability) {
                    bestPrediction = prediction[i];
                }
            }

            const card = document.getElementById("brand-card");
            const title = document.getElementById("brand-title");
            const desc = document.getElementById("brand-desc");

            // Si la probabilidad es alta (> 70%) y no es "Nada"
            if (bestPrediction.probability > 0.70 && bestPrediction.className !== "Nada") {
                card.style.display = "block";
                title.innerText = bestPrediction.className;
                mostrarInfo(bestPrediction.className, desc);
            } else {
                card.style.display = "none";
            }
        }

        function mostrarInfo(marca, elemento) {
            const info = {
                "iphone": "Marca: Apple Inc. <br> Sede: California, EE.UU. <br> Dato: El primer iPhone se lanzó en 2007.",
                "Samsung": "Marca: Samsung Electronics <br> Sede: Suwon, Corea del Sur. <br> Dato: Líder mundial en pantallas AMOLED.",
                "Xiaomi": "Marca: Xiaomi Corporation <br> Sede: Pekin, China. <br> Dato: Conocida por su relación calidad-precio."
            };
            elemento.innerHTML = info[marca] || "Información no disponible";
        }

        init();
    </script>
</body>
</html>
